services:
  hgq:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        HOST_UID: 2242
        HOST_GID: 1201
        PYTHON_VERSION: 3.12
        VERILATOR_VERSION: 5.026
        PY_EXTRAS: test  # ← hardcode extras here, e.g. "dev", "test", or leave blank ""
        JAX_PLATFORMS: cpu

    image: hgq-dev:latest
    container_name: hgq-dev
    working_dir: /workspace

    volumes:
      - ..:/workspace:rw
      # Optional: persistent ccache directory for faster rebuilds
      # uncomment if on server where you are not sudo, comment the other one.
      # - hgq-ccache:/home/dev/.cache/ccache
      - hgq-ccache:/root/.cache/ccache   # ← was /home/dev/.cache/ccache
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # - ${XAUTHORITY}:${XAUTHORITY}:ro   # ← mount the actual xauth file in-place
    
    tty: true
    stdin_open: true

    # Optional X11/GTKWave support — uncomment if you use GUI tools
    environment:
      - KERAS_BACKEND=jax
      - JAX_PLATFORMS=cpu
      # - DISPLAY=${DISPLAY}
      # - QT_X11_NO_MITSHM=1
      # - XAUTHORITY=${XAUTHORITY}
    devices:
      - /dev/dri:/dev/dri
      

volumes:
  hgq-ccache:
